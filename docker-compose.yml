# 健康大數據 App — 一期 PoC
# 啟動：docker compose up -d db redis && make migrate && make seed && docker compose up -d api worker
# web（四個前端 app）於 M4 加入。

name: healthapp

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment:
    PG_HOST: db
    PG_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERPASS:?請在 .env 設定 PG_SUPERPASS}
      POSTGRES_DB: ${PG_DB:-healthapp}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${PG_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres} -d ${PG_DB:-healthapp}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性：套用 migrations（docker compose run --rm migrate）
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: ["tools"]

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
  redisdata:
