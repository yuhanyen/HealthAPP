# Render Blueprint：Dashboard → New → Blueprint → 選這個 repo，一次建立：
#   healthapp-db（PostgreSQL 16）、
#   healthapp（Docker：API＋worker＋四個前端＋事件匯流用的 Redis，第一次啟動自動 migrate 並載入示範資料）
# 唯一要手動填的是 ANTHROPIC_API_KEY（可留空：A1–A4 改用規則式）。
# 免費方案限制：資料庫 30 天後到期、閒置 15 分鐘會休眠（休眠時排程不會跑）。
# 不建 Render Key Value：免費方案每個 workspace 只能有 1 個；Redis 跑在容器內（見 deploy/start.sh）。

databases:
  - name: healthapp-db
    plan: free
    region: singapore
    databaseName: healthapp
    postgresMajorVersion: "16"

services:
  - type: web
    name: healthapp
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: healthapp-db
          property: connectionString
      # 不設 REDIS_URL：start.sh 會在容器內啟動 Redis
      - key: EVENT_BUS
        value: redis
      # 容器內 Redis 上限 64 MB 且不逐出（滿了會寫入失敗），事件流只留近 2 萬則
      - key: EVENT_STREAM_MAXLEN
        value: "20000"
      # 六個 DB 應用角色的密碼與各項金鑰：由 Render 產生，不需要人工設定
      - key: IDN_APP_PASSWORD
        generateValue: true
      - key: IDN_USER_SCOPED_PASSWORD
        generateValue: true
      - key: IDN_SITE_SCOPED_PASSWORD
        generateValue: true
      - key: ANON_READER_PASSWORD
        generateValue: true
      - key: ANON_WRITER_PASSWORD
        generateValue: true
      - key: AUDIT_WRITER_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: NATIONAL_ID_PEPPER
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      # 示範資料：資料庫沒有使用者時於背景載入（免費方案 CPU 很小，人數與週數減半）
      - key: SEED_ON_START
        value: "1"
      - key: SEED_POPULATION
        value: "600"
      - key: SEED_WEEKS
        value: "8"
      - key: A1_PARALLELISM
        value: "2"
