[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os
# Keep this file ASCII-only: alembic reads it with the locale encoding (cp950 on zh-TW Windows).
# The DB URL is built in app/db/migrations/env.py from .env (migrator = superuser).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
